preset:
  name: local-host
  description: "Allow sandbox access to host-local services on host.docker.internal"

network_policies:
  local_host:
    name: local_host
    endpoints:
      - host: host.docker.internal
        access: full
        allowed_ips:
          - 192.168.65.254
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.11 }
      - { path: /usr/local/bin/node }
      - { path: /usr/local/bin/openclaw }
