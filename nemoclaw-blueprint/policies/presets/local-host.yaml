preset:
  name: local-host
  description: "Allow sandbox access to host-local services on port 8765 via host.docker.internal and host.openshell.internal"

network_policies:
  local_host:
    name: local_host
    endpoints:
      - host: host.docker.internal
        port: 8765
        access: full
      - host: host.openshell.internal
        port: 8765
        access: full
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.11 }
      - { path: /usr/local/bin/node }
      - { path: /usr/local/bin/openclaw }
